{% load static %} <!-- Loads Django static tag library (Ładuje bibliotekę tagów static w Django) -->
<!DOCTYPE html> <!-- Declares document type as HTML5 (Deklaruje typ dokumentu jako HTML5) -->
<html lang="en"> <!-- Opens HTML root element (Otwiera główny element HTML) -->
<head>
    <meta charset="UTF-8"> <!-- Sets UTF-8 encoding (Ustawia kodowanie znaków UTF-8) -->
    <title>Delete Word</title> <!-- Sets page title (Ustawia tytuł strony) -->
    <link rel="stylesheet" href="{% static 'vocabulary/style.css' %}"> <!-- Links our CSS stylesheet (Podpina nasz arkusz stylów CSS) -->
</head>
<body>
    <div class="container"> <!-- Centered card container (Wyśrodkowany kontener karty) -->
        <h1>Confirm Deletion</h1> <!-- Main heading (Główny nagłówek) -->

        <p style="margin-bottom: 20px;">Are you sure you want to delete the word: <strong>{{ word.foreign_word }} - {{ word.translation }}</strong>?</p> <!-- Confirmation prompt showing the target word (Komunikat potwierdzenia pokazujący usuwane słówko) -->

        <form method="POST"> <!-- Form submitting deletion via POST (Formularz przesyłający usunięcie metodą POST) -->
            {% csrf_token %} <!-- Django CSRF protection token (Token ochrony CSRF w Django) -->
            <div class="actions"> <!-- Groups confirm and cancel buttons together (Grupuje razem przyciski potwierdzenia i anulowania) -->
                <button type="submit" class="btn btn-danger">Yes, Delete</button> <!-- Red danger button confirming deletion (Czerwony przycisk ostrzegawczy potwierdzający usunięcie) -->
                <a href="{% url 'word_list' %}" class="btn btn-secondary">Cancel</a> <!-- Secondary button to cancel deletion (Drugorzędny przycisk anulujący usunięcie) -->
            </div> <!-- Closes actions group (Zamyka grupę akcji) -->
        </form> <!-- Closes form element (Zamyka element formularza) -->
    </div> <!-- Closes container box (Zamyka pudełko kontenera) -->
</body>
</html> <!-- Cl
