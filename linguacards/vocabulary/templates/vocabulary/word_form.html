{% load static %} <!-- Loads Django static tag library (Ładuje bibliotekę tagów static w Django) -->
<!DOCTYPE html> <!-- Declares document type as HTML5 (Deklaruje typ dokumentu jako HTML5) -->
<html lang="en"> <!-- Opens HTML root element (Otwiera główny element HTML) -->
<head>
    <meta charset="UTF-8"> <!-- Sets UTF-8 encoding (Ustawia kodowanie znaków UTF-8) -->
    <title>{% if word %}Edit Word{% else %}Add New Word{% endif %}</title> <!-- Dynamically sets page title based on whether we are editing an existing word or adding a new one (Dynamicznie ustawia tytuł strony w zależności od tego, czy edytujemy istniejące słowo, czy dodajemy nowe) -->
    <link rel="stylesheet" href="{% static 'vocabulary/style.css' %}"> <!-- Links our CSS stylesheet (Podpina nasz arkusz stylów CSS) -->
</head>
<body>
    <div class="container"> <!-- Centered card container (Wyśrodkowany kontener karty) -->
        <h1>{% if word %}Edit Flashcard{% else %}Add a New Flashcard{% endif %}</h1> <!-- Shows Edit heading if word exists, otherwise Add heading (Pokazuje nagłówek Edycji, jeśli słówko istnieje, w przeciwnym razie nagłówek Dodawania) -->

        <form method="POST"> <!-- Form sending data via POST method (Formularz wysyłający dane metodą POST) -->
            {% csrf_token %} <!-- Django CSRF protection token (Token ochrony CSRF w Django) -->
            {{ form.as_p }} <!-- Renders form fields wrapped in paragraphs (Renderuje pola formularza opakowane w akapity) -->
            <div class="actions"> <!-- Groups submit and cancel buttons neatly (Grupuje przyciski zapisu i anulowania) -->
                <button type="submit" class="btn btn-primary">{% if word %}Save Changes{% else %}Save Word{% endif %}</button> <!-- Submit button with dynamic label (Przycisk wysyłania z dynamiczną etykietą) -->
                <a href="{% url 'word_list' %}" class="btn btn-secondary">Back to List</a> <!-- Cancel/back button returning to word list (Przycisk powrotu/anulowania wracający do listy słówek) -->
            </div> <!-- Closes actions group (Zamyka grupę akcji) -->
        </form> <!-- Closes form element (Zamyka element formularza) -->
    </div> <!-- Closes container box (Zamyka pudełko kontenera) -->
</body>
</html> <!-- Closes HTML document (Zamyka dokument HTML) -->
